<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Brainrot Bastion — Tower Defense</title>
  <meta name="description" content="Tower defense : repousse l'invasion des brainrots avec ton arsenal d'armes cartoon.">
  <meta name="theme-color" content="#2a2140">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brainrot TD">
  <meta name="application-name" content="Brainrot TD">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="app">

  <!-- ================= MENU ================= -->
  <section id="screen-menu" class="screen active">
    <div class="menu">
      <div class="chips">
        <span class="chip"><i data-ico="gem" class="gem-ico"></i><b class="gems">0</b></span>
        <span class="chip"><i data-ico="trophy" class="gold"></i><b id="menu-best">0</b></span>
      </div>
      <h1 class="logo" aria-label="Brainrot Bastion">
        <span class="l1">BRAINROT</span>
        <span class="l2">BASTION</span>
        <small>TOWER DEFENSE</small>
      </h1>
      <div id="menu-parade" aria-hidden="true"></div>
      <div class="menu-buttons">
        <button class="btn primary big" data-go="world"><i data-ico="play"></i>Jouer</button>
        <button class="btn pink" data-go="shop"><i data-ico="cart"></i>Boutique</button>
        <button class="btn ghost" data-go="settings"><i data-ico="gear"></i>Paramètres</button>
      </div>
    </div>
  </section>

  <!-- ================= CAMPAGNE ================= -->
  <section id="screen-world" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-go="menu" aria-label="Retour"><i data-ico="back"></i></button>
      <h2>Campagne</h2>
      <span class="chip"><i data-ico="star" class="gold"></i><b id="world-stars">0</b></span>
    </header>
    <div class="scroll" id="world-scroll"><div id="world-map"></div></div>
    <div class="world-foot"><button class="btn pink" id="btn-endless"></button></div>
  </section>

  <!-- ================= BOUTIQUE ================= -->
  <section id="screen-shop" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-go="menu" aria-label="Retour"><i data-ico="back"></i></button>
      <h2>Boutique</h2>
      <span class="chip"><i data-ico="gem" class="gem-ico"></i><b class="gems">0</b></span>
    </header>
    <nav class="seg" id="shop-tabs">
      <button data-tab="skins">Skins</button>
      <button data-tab="achievements">Succès</button>
    </nav>
    <div class="scroll"><div class="list" id="shop-content"></div></div>
  </section>

  <!-- ================= PARAMÈTRES ================= -->
  <section id="screen-settings" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-go="menu" aria-label="Retour"><i data-ico="back"></i></button>
      <h2>Paramètres</h2>
      <span style="width:42px"></span>
    </header>
    <div class="scroll"><div class="list" id="settings-content"></div></div>
  </section>

  <!-- ================= JEU ================= -->
  <section id="screen-game" class="screen">
    <main id="stage"><canvas id="game" aria-label="Terrain de jeu"></canvas></main>
    <header id="hud">
      <div class="stat" id="hud-lives"><i data-ico="heart"></i><b>20</b></div>
      <div class="stat" id="hud-money"><i class="coin-ico"></i><b>0</b></div>
      <div class="stat" id="hud-wave"><i data-ico="wave"></i><b>0/30</b></div>
      <div class="stat score" id="hud-score"><i data-ico="trophy"></i><b>0</b></div>
      <div class="hud-btns">
        <button class="icon-btn" id="btn-speed" aria-label="Vitesse du jeu"><b>x1</b></button>
        <button class="icon-btn" id="btn-pause" aria-label="Pause"><i data-ico="pause"></i></button>
        <button class="icon-btn" id="btn-mute" aria-label="Son"></button>
      </div>
    </header>
    <div id="tutorial" hidden></div>
    <footer id="dock">
      <div class="dock-row"><div id="abilities"></div><div id="boosts"></div></div>
      <div class="wave-row">
        <div id="wave-preview"></div>
        <button class="btn primary" id="btn-wave"></button>
      </div>
    </footer>
    <div id="radial" hidden></div>
  </section>

  <div id="overlay" class="overlay"></div>
  <div id="toasts"></div>
  <div id="load-error" hidden>
    <b>Le jeu n'a pas pu démarrer.</b>
    <p>Les modules JavaScript ne se chargent pas depuis <code>file://</code>.<br>Lance un petit serveur local dans ce dossier :</p>
    <pre>python3 -m http.server 8000</pre>
    <p>puis ouvre <code>http://localhost:8000</code></p>
  </div>
</div>
<script type="module" src="js/main.js"></script>
<script>
  // Message d'aide si les modules ES n'ont pas pu se charger (ouverture en file://)
  setTimeout(function () { if (!window.__bastionLoaded) document.getElementById('load-error').hidden = false; }, 2500);
</script>
</body>
</html>
